<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Склад — панель администратора</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg: #eef1f4;
    --panel: #ffffff;
    --ink: #1c2733;
    --ink-soft: #5b6b7c;
    --line: #dbe1e8;
    --line-soft: #e8ecf1;
    --brand: #2c5c8a;
    --brand-dark: #204569;
    --brand-soft: #e5edf5;
    --warn: #b9762a;
    --warn-soft: #fbf0e2;
    --bad: #b23b3b;
    --bad-soft: #fbe9e9;
    --ok: #2f7a4f;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex; height:100vh; overflow:hidden;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:236px; flex:none;
    background:var(--brand-dark);
    color:#dce7f2;
    display:flex; flex-direction:column;
    padding:18px 0;
    transition:width .18s ease;
    overflow:hidden;
  }
  .sidebar.collapsed{
    width:54px;
  }
  .brand{
    min-height:42px;
    padding:0 14px 18px 14px;
    font-weight:600; font-size:15px; letter-spacing:.2px;
    color:#fff;
    border-bottom:1px solid rgba(255,255,255,.12);
    margin-bottom:10px;
    display:flex; align-items:flex-start; gap:10px;
    white-space:nowrap;
  }
  .brand-icon{
    display:flex; align-items:center; justify-content:center;
    width:26px; height:26px; flex:none;
    border:1px solid rgba(255,255,255,.28);
    border-radius:6px; font-size:15px; line-height:1;
  }
  .brand-copy{display:block; min-width:190px;}
  .sidebar.collapsed .brand{
    justify-content:center;
    padding-left:14px; padding-right:14px;
  }
  .sidebar.collapsed .brand-copy{
    display:none;
  }
  .brand small{display:block; font-weight:400; font-size:11.5px; color:#9fb6cd; margin-top:2px;}
  .menu-toggle{
    all:unset; cursor:pointer;
    display:flex; align-items:center; gap:10px;
    min-height:38px; margin:0 10px 8px; padding:0 12px;
    border-radius:6px; color:#dce7f2; font-size:13px;
    transition:background .12s ease, color .12s ease;
    white-space:nowrap;
  }
  .menu-toggle:hover{background:rgba(255,255,255,.08); color:#fff;}
  .menu-toggle .toggle-icon{font-size:18px; width:16px; text-align:center; flex:none;}
  .sidebar.collapsed .menu-toggle{
    justify-content:center; margin-left:8px; margin-right:8px; padding-left:0; padding-right:0;
  }
  .sidebar.collapsed .toggle-text{display:none;}
  .sidebar.collapsed nav.mainnav{display:none;}
  nav.mainnav{display:flex; flex-direction:column; gap:2px; padding:6px 10px;}
  nav.mainnav button{
    all:unset; cursor:pointer;
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:6px;
    color:#c7d7e6; font-size:13.5px;
    transition:background .12s ease, color .12s ease;
  }
  nav.mainnav button .num{
    font-family:var(--mono); font-size:11px; color:#7f9bb6;
    width:16px; text-align:right; flex:none;
  }
  nav.mainnav button:hover{background:rgba(255,255,255,.06); color:#fff;}
  nav.mainnav button.active{background:var(--brand); color:#fff;}
  nav.mainnav button.active .num{color:#cfe0f0;}

  /* ---------- Main ---------- */
  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{
    padding:16px 26px 0 26px; flex:none; position:relative;
  }
  .topbar h1{font-size:18px; margin:0 0 2px 0; font-weight:600;}
  .topbar .sub{color:var(--ink-soft); font-size:12.5px; margin-bottom:12px;}
  .subnav{display:flex; gap:6px; border-bottom:1px solid var(--line); padding-bottom:0;}
  .subnav button{
    all:unset; cursor:pointer;
    padding:9px 14px; font-size:13px; color:var(--ink-soft);
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .subnav button:hover{color:var(--ink);}
  .subnav button.active{color:var(--brand-dark); border-bottom-color:var(--brand); font-weight:600;}

  .content{flex:1; overflow:auto; padding:18px 26px 30px 26px;}

  /* ---------- Profile widget ---------- */
  .profile-bar{display:flex; align-items:center; gap:8px; cursor:pointer; padding:6px 10px; border-radius:20px;}
  .profile-bar:hover{background:var(--line-soft);}
  .avatar{width:28px; height:28px; border-radius:50%; background:var(--brand); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none;}
  .pname{font-size:13px; font-weight:600; white-space:nowrap;}
  .profile-panel{
    position:absolute; right:26px; top:54px; background:#fff; border:1px solid var(--line);
    border-radius:8px; padding:14px 16px; width:250px; box-shadow:0 10px 30px rgba(0,0,0,.14); z-index:60;
  }
  .pp-row{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:5px 0; border-bottom:1px solid var(--line-soft);}
  .pp-row span{color:var(--ink-soft);}
  .pp-row:last-of-type{border-bottom:none;}

  /* ---------- Toolbar (search/sort) ---------- */
  .toolbar{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
  .search{position:relative; flex:none; width:280px;}
  .search input{
    width:100%; padding:8px 10px 8px 30px; border:1px solid var(--line);
    border-radius:6px; font-size:13px; background:#fff; color:var(--ink); outline:none;
  }
  .search input:focus{border-color:var(--brand);}
  .search svg{position:absolute; left:9px; top:9px; width:14px; height:14px; color:var(--ink-soft);}
  .count-pill{font-size:12px; color:var(--ink-soft); padding:6px 10px; background:var(--line-soft); border-radius:20px;}
  .sort-hint{font-size:12px; color:var(--ink-soft);}

  /* ---------- Главный поиск как в рабочем окне Warehouse ---------- */
  .admin-home{min-height:calc(100vh - 110px); position:relative; overflow:auto;
    background:linear-gradient(145deg,#eef5fb 0%,#f8fafc 58%,#eaf2f9 100%);
    border:1px solid var(--line); border-radius:12px; padding:0 18px 36px;}
  .admin-home-search-wrap{max-width:760px; margin:0 auto; padding-top:clamp(22vh,210px,31vh);
    transition:padding-top .42s cubic-bezier(.2,0,0,1);}
  .admin-home.searching .admin-home-search-wrap{padding-top:28px;}
  .admin-home-brand{text-align:center; color:#1768b3; font-size:25px; font-weight:800;
    letter-spacing:5px; margin-bottom:22px; text-shadow:0 2px 12px rgba(23,104,179,.16);}
  .admin-home-brand small{display:block; margin-top:6px; color:var(--ink-soft); font-size:11px;
    letter-spacing:1.7px; font-weight:600;}
  .admin-main-search{display:flex; align-items:center; gap:8px; background:#fff; padding:8px 10px 8px 20px;
    border:2px solid rgba(28,126,214,.38); border-radius:34px; box-shadow:0 8px 28px rgba(30,75,115,.16);}
  .admin-main-search input{width:100%; min-width:0; border:0; outline:0; background:transparent;
    color:var(--ink); font-size:16px; padding:10px 0;}
  .admin-main-search input::placeholder{color:#a0aab4;}
  .admin-search-clear{display:none; flex:none; width:30px; height:30px; border:0; border-radius:50%;
    background:#edf1f4; color:#65727e; cursor:pointer;}
  .admin-search-clear.visible{display:block;}
  .admin-home-results{max-width:980px; margin:18px auto 0; display:none;}
  .admin-home.searching .admin-home-results{display:block;}
  .admin-search-status{display:flex; align-items:center; gap:8px; margin:0 2px 8px; color:var(--ink-soft); font-size:12px;}
  .admin-search-filter{display:inline-flex; align-items:center; gap:6px; padding:5px 9px; border:0;
    border-radius:15px; background:#dbeeff; color:#1768b3; cursor:pointer; font-size:11px;}
  .admin-search-results-table{background:rgba(255,255,255,.96); border:1px solid #dce6ef; border-radius:12px;
    overflow:hidden; box-shadow:0 5px 18px rgba(30,75,115,.10);}
  .admin-search-results-table table{margin:0;}
  .admin-search-results-table tbody tr{cursor:pointer;}
  .admin-search-results-table tbody tr:hover{background:#edf7ff;}
  .admin-search-results-table .date-divider td{padding:8px 12px; background:#e9f3fb; color:#1768b3;
    border-bottom:1px solid #d6e7f4; font-size:12px; font-weight:700;}
  .admin-search-results-table .result-meta{display:block; margin-top:3px; color:var(--ink-soft); font-size:11px;}
  .admin-search-empty{padding:35px 16px; text-align:center; color:var(--ink-soft); background:#fff;}
  .admin-floating-card{position:fixed; z-index:75; left:50%; bottom:22px; width:min(560px,calc(100vw - 44px));
    padding:16px 18px; color:#fff; background:linear-gradient(135deg,#155da8,#1c7ed6);
    border-radius:18px; box-shadow:0 12px 32px rgba(0,35,75,.32); transform:translate(-50%,calc(100% + 35px));
    opacity:0; pointer-events:none; transition:transform .35s cubic-bezier(.1,1,.1,1),opacity .25s ease;}
  .admin-floating-card.open{transform:translate(-50%,0); opacity:1; pointer-events:auto;}
  .admin-floating-card-head{display:flex; align-items:flex-start; gap:10px; border-bottom:1px solid rgba(255,255,255,.23);
    padding-bottom:9px; margin-bottom:10px;}
  .admin-floating-card-title{font-size:17px; font-weight:800; flex:1; min-width:0; overflow-wrap:anywhere;}
  .admin-floating-card-close{width:30px; height:30px; border:1px solid rgba(255,255,255,.38); border-radius:50%;
    background:rgba(255,255,255,.12); color:#fff; cursor:pointer;}
  .admin-card-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px;}
  .admin-card-field{display:flex; flex-direction:column; gap:2px; padding:7px 9px; border-radius:8px;
    background:rgba(255,255,255,.13); min-width:0;}
  .admin-card-label{font-size:10px; opacity:.7; text-transform:uppercase; font-weight:700;}
  .admin-card-value{font-size:13px; font-weight:700; overflow-wrap:anywhere;}
  .admin-card-link{padding:0; border:0; color:#fff; text-align:left; background:transparent; cursor:pointer;
    text-decoration:underline; text-decoration-color:rgba(255,255,255,.45); text-underline-offset:2px;}
  @media(max-width:700px){
    .admin-home{padding-left:10px;padding-right:10px;}
    .admin-home-brand{font-size:20px;letter-spacing:3px;}
    .admin-card-grid{grid-template-columns:1fr;}
  }

  /* ---------- Table ---------- */
  .table-wrap{background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; font-weight:600; color:var(--ink-soft);
    padding:9px 12px; border-bottom:1px solid var(--line);
    background:#f7f9fb; white-space:nowrap; position:sticky; top:0;
  }
  thead th.sortable{cursor:pointer; user-select:none;}
  thead th.sortable:hover{color:var(--ink);}
  thead th .arrow{font-size:10px; margin-left:4px; color:var(--brand);}
  tbody td{padding:9px 12px; border-bottom:1px solid var(--line-soft); vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fafbfd;}
  td.mono, .mono{font-family:var(--mono); font-size:12.5px; color:var(--ink);}
  td.num{white-space:nowrap;}
  .badge{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11.5px; font-weight:600;}
  .badge.warn{background:var(--warn-soft); color:var(--warn);}
  .badge.bad{background:var(--bad-soft); color:var(--bad);}
  .badge.ok{background:#e7f3ec; color:var(--ok);}
  .badge.brand{background:var(--brand-soft); color:var(--brand-dark);}
  .empty-row td{text-align:center; padding:36px 12px; color:var(--ink-soft);}
  .table-wrap tr.date-divider td{padding:8px 12px; background:#e9f3fb; color:#1768b3;
    border-bottom:1px solid #d6e7f4; font-size:12px; font-weight:700;}
  .icon-btn{all:unset; cursor:pointer; padding:4px 7px; border-radius:4px; font-size:13px; margin-right:2px;}
  .icon-btn:hover{background:var(--line-soft);}

  /* ---------- Cards / generic panels ---------- */
  .card{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px;}
  .card + .card{margin-top:14px;}
  .card h3{margin:0 0 4px 0; font-size:14.5px;}
  .card .desc{color:var(--ink-soft); font-size:12.5px; margin-bottom:14px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .btn{
    all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
    background:var(--brand); color:#fff; padding:9px 16px; border-radius:6px;
    font-size:13px; font-weight:600;
  }
  .btn:hover{background:var(--brand-dark);}
  .btn.secondary{background:#fff; color:var(--brand-dark); border:1px solid var(--line);}
  .btn.secondary:hover{background:var(--brand-soft);}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px;}
  .field input[type=text], .field input[type=number], .field input[type=date], .field input[type=datetime-local],
  .field select, .field textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px;
    background:#fff; color:var(--ink); font-family:var(--sans);
  }
  .field textarea{resize:vertical; min-height:64px;}
  .row-check{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line-soft);}
  .row-check:last-child{border-bottom:none;}
  .row-check label{font-size:13px; flex:1;}
  .filepick{border:1.5px dashed var(--line); border-radius:8px; padding:22px; text-align:center; cursor:pointer; background:#fafbfc;}
  .filepick:hover{border-color:var(--brand); background:var(--brand-soft);}
  .filepick input{display:none;}
  .filepick .fname{font-size:12.5px; color:var(--brand-dark); margin-top:8px; font-family:var(--mono);}
  .radio-row{display:flex; gap:16px; margin-bottom:14px;}
  .radio-row label{display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer;}
  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--ink); color:#fff; padding:12px 18px;
    border-radius:8px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.18); opacity:0; transform:translateY(8px);
    transition:opacity .2s ease, transform .2s ease; pointer-events:none; z-index:80;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .status-toggle{all:unset; cursor:pointer; font-size:12px; padding:3px 9px; border-radius:20px; font-weight:600;}
  .placeholder-list{display:flex; flex-direction:column; gap:8px;}
  .task-item{display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--line-soft);}
  .task-item:last-child{border-bottom:none;}
  .task-item .txt{font-size:13px; color:var(--ink);}
  .task-item .meta{font-size:11.5px; color:var(--ink-soft); margin-top:3px;}
  .task-item .actions{margin-left:auto; flex:none;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,22,32,.4); display:flex; align-items:center; justify-content:center; z-index:70;
  }
  .modal-card{
    background:#fff; border-radius:10px; padding:22px; width:440px; max-width:92vw; max-height:88vh; overflow:auto;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal-card h3{margin:0 0 14px 0; font-size:15.5px;}
  .print-card{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:14px 16px; margin-bottom:14px;
  }
  .print-card h3{margin:0 0 4px 0; font-size:14px;}
  .print-card .desc{margin-bottom:10px;}
  .print-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px;}
  .print-filters{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-top:12px;}
  .print-filters .field{margin:0; min-width:145px;}
  .print-filters .field label{margin-bottom:4px;}
  .column-picker{
    display:flex; flex-wrap:wrap; gap:7px 14px; padding:9px 0 0;
    border-top:1px solid var(--line-soft); margin-top:11px;
  }
  .column-picker label{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-soft);}
  .receipt-kind{white-space:nowrap;}
  .cell-meta{display:block; color:var(--ink-soft); font-size:11px; margin-top:2px;}
  .print-report{display:none;}
  @media print{
    body > *:not(.print-report){display:none !important;}
    .print-report{
      display:block !important; position:static; padding:0; color:#000; background:#fff;
      font-family:Arial, sans-serif;
    }
    .print-report h1{font-size:18px; margin:0 0 5px;}
    .print-report .print-meta{font-size:11px; color:#444; margin-bottom:12px;}
    .print-report table{width:100%; border-collapse:collapse; font-size:10px;}
    .print-report th,.print-report td{border:1px solid #999; padding:5px 6px; text-align:left; vertical-align:top;}
    .print-report th{background:#eee; font-weight:700;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar collapsed" id="sidebar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">▦</span>
      <span class="brand-copy">Склад · Админ<br><small>Панель управления приёмкой</small></span>
    </div>
    <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="mainnav">
      <span class="toggle-icon" aria-hidden="true">☰</span>
      <span class="toggle-text">Меню</span>
    </button>
    <nav class="mainnav" id="mainnav"></nav>
  </aside>
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content" id="content">Загрузка…</div>
  </main>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>
<div class="admin-floating-card" id="adminFloatingCard" aria-live="polite"></div>

<script>
/* =========================================================
   FIREBASE
   ========================================================= */
if (!window.firebase ||
    typeof window.firebase.auth !== "function" ||
    typeof window.firebase.firestore !== "function") {
  document.getElementById("content").innerHTML = `
    <div class="card">
      <h3>Не удалось загрузить Firebase</h3>
      <div class="desc">Проверьте подключение к интернету и обновите страницу.</div>
    </div>
  `;
} else {
const initializeApp = firebase.initializeApp;
const getFirestore = () => firebase.firestore();
const collection = (database, name) => database.collection(name);
const doc = (database, collectionName, id) => database.collection(collectionName).doc(id);
const addDoc = (reference, data) => reference.add(data);
const setDoc = (reference, data, options) => reference.set(data, options || {});
const updateDoc = (reference, data) => reference.update(data);
const deleteDoc = (reference) => reference.delete();
const onSnapshot = (reference, ...args) => reference.onSnapshot(...args);
const query = (reference, ...constraints) =>
  constraints.reduce((current, constraint) => {
    if(constraint.type === "where"){
      return current.where(constraint.field, constraint.operator, constraint.value);
    }
    return current.orderBy(constraint.field, constraint.direction);
  }, reference);
const orderBy = (field, direction = "asc") => ({field, direction});
const where = (field, operator, value) => ({type:"where", field, operator, value});
const getDoc = (reference) => reference.get();
const getDocs = (reference) => reference.get();
const serverTimestamp = () => firebase.firestore.FieldValue.serverTimestamp();

const firebaseConfig = {
  apiKey: "AIzaSyAdieSc0CpKvG-WfsLqaJkhFV_w69A4nQQ",
  authDomain: "warehouse26-fbbee.firebaseapp.com",
  projectId: "warehouse26-fbbee",
  storageBucket: "warehouse26-fbbee.firebasestorage.app",
  messagingSenderId: "965022333314",
  appId: "1:965022333314:web:cc42992352bb1ee855379b",
  measurementId: "G-QQ7G4S2HL5"
};
const fbApp = initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = getFirestore(fbApp);

const COL = {
  blind: "blind_receipt",
  auto: "auto_receipt",
  task: "assignment_receipt",
  history: "history",
  catalog: "catalog",
  newProducts: "new_products",
  users: "users",
};

/* =========================================================
   СЕССИЯ / ПРОФИЛЬ
   ========================================================= */
window.currentProfile = null;

function logout(){
  auth.signOut().catch(()=>{}).finally(()=>{
    localStorage.removeItem("wh_user_id");
    localStorage.removeItem("wh_authenticated");
    localStorage.removeItem("wh_is_admin");
    localStorage.removeItem("wh_role");
    location.href = "index.html";
  });
}

/* =========================================================
   ЛОКАЛЬНОЕ СОСТОЯНИЕ ДАННЫХ (наполняется из Firestore в реальном времени)
   ========================================================= */
const DB = {
  blind: [], autoRecv: [], taskRecv: [], history: [], catalog: [], newProducts: [], users: [],
  windows: [],

const ADMIN_CACHE_PREFIX = "warehouse_admin_cache_v2_";
const ADMIN_POLL_INTERVAL = 5 * 60 * 1000;
const adminPollers = [];
let adminPollTimer = null;
let adminPollInFlight = false;
let adminNewProductsCount = null;

function adminCacheKey(name){
  const uid = String(localStorage.getItem("wh_user_id") || "anonymous")
    .replace(/[^a-zA-Z0-9_-]/g, "_");
  return ADMIN_CACHE_PREFIX + uid + "_" + name;
}
function adminReadCache(name, fallback){
  try{
    const raw = JSON.parse(localStorage.getItem(adminCacheKey(name)) || "null");
    return raw && Array.isArray(raw.rows) ? raw.rows : fallback;
  }catch(error){ return fallback; }
}
function adminWriteCache(name, rows){
  try{
    localStorage.setItem(adminCacheKey(name), JSON.stringify({
      savedAt: Date.now(), rows: Array.isArray(rows) ? rows : []
    }));
  }catch(error){}
}
function adminCachedRows(name, apply){
  const rows = adminReadCache(name, []);
  if(rows.length){
    apply(rows);
  }
}
function registerAdminPoller(name, fetchRows, applyRows){
  const run = async (silent = false)=>{
    try{
      const rows = await fetchRows();
      adminWriteCache(name, rows);
      applyRows(rows);
      return rows;
    }catch(error){
      if(!silent) toast(`Ошибка обновления «${name}»: ${error.message}`);
      return null;
    }
  };
  adminPollers.push(run);
  run(true);
}
async function pollAdminData(){
  if(adminPollInFlight) return;
  adminPollInFlight = true;
  try{
    await Promise.all(adminPollers.map(poller=>poller(true)));
    toast("Кэш админ-панели обновлён");
  }finally{
    adminPollInFlight = false;
  }
}
function startAdminPolling(){
  if(adminPollTimer) clearInterval(adminPollTimer);
  adminPollTimer = setInterval(()=>pollAdminData(), ADMIN_POLL_INTERVAL);
}

function pad(n){return String(n).padStart(2,"0");}
function fmtDT(d){return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function fmtD(d){return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;}
function dateOnlyKey(d){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function toDateInputValue(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function toDatetimeLocalValue(d){return `${toDateInputValue(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function expiryBadge(d){
  const days = Math.round((d - new Date())/86400000);
  if(days < 0) return `<span class="badge bad">${fmtD(d)} · истёк</span>`;
  if(days <= 14) return `<span class="badge warn">${fmtD(d)} · ${days} дн.</span>`;
  return `<span class="badge ok">${fmtD(d)}</span>`;
}

function subscribeReceiptCollection(colName, key, receiptType){
  const normalize = rows => rows.map(data=>{
      return {
        id:data.id || "",
        dt: data.dt ? new Date(data.dt) :
          (data.date ? new Date(data.date) :
          (data.receivedAt ? new Date(data.receivedAt) : new Date())),
        user: data.user||"", article: data.article||"", order: data.order||"",
        sender: data.sender||"", product: data.product||data.name||"",
         quantity: Number(data.quantity ?? data.qty ?? data.menge ?? 0),
        expiry: data.expiry ? new Date(data.expiry) : new Date(),
        barcode: data.barcode||data.ean||"",
         receiptType: data.receiptType || data.receivingType || receiptType || "",
        windowId: data.windowId||"",
        windowName: data.windowName||"",
        userId: data.userId||"",
         userEmail: data.userEmail||data.email||"",
      };
     }).sort((a,b)=>b.dt.getTime()-a.dt.getTime());
  const hydrate = rows => rows.map(row=>({
    ...row,
    dt:new Date(row.dt),
    expiry:row.expiry ? new Date(row.expiry) : new Date()
  })).sort((a,b)=>b.dt.getTime()-a.dt.getTime());
  adminCachedRows(key, rows=>{
    DB[key] = hydrate(rows);
    maybeRerender(colName);
  });
  registerAdminPoller(key, async()=>{
    const snap = await getDocs(collection(db, colName));
    return snap.docs.map(d=>({id:d.id, ...d.data()}));
  }, rows=>{
    DB[key] = normalize(rows);
    maybeRerender(colName);
  });
}

function catalogRowKey(row){
  const barcode = String(row.barcode || row.ean || "").trim();
  if(barcode) return "barcode:" + barcode;
  const article = String(row.article || row.artikel || "").trim().toLowerCase();
  if(article) return "article:" + article;
  return "name:" + String(row.name || "").trim().toLowerCase();
}
function catalogCategory(row){
  return String(row && row.category || "").trim() || "Без категории";
}
function mergeCatalogRows(warehouseRows, onlineRows){
  const merged = new Map();
  (warehouseRows || []).forEach(row=>{
    const key = catalogRowKey(row);
    if(key !== "name:") merged.set(key, {...row});
  });
  (onlineRows || []).forEach(row=>{
    const key = catalogRowKey(row);
    if(key === "name:") return;
    // The top-level catalog is authoritative for fields maintained in the
    // admin panel (especially category and unit).
    merged.set(key, {...(merged.get(key)||{}), ...row});
  });
  return Array.from(merged.values());
}

/* =========================================================
   ТАБЛИЦЫ ПРИЁМКИ / ИСТОРИИ (общий рендер с CRUD)
   ========================================================= */
function filterRows(rows, query){
  if(!query) return rows;
  const q = query.trim().toLowerCase();
  if(!q) return rows;
  return rows.filter(r =>
    (r.user||"").toLowerCase().includes(q) ||
    (r.receiptType||"").toLowerCase().includes(q) ||
    (r.article||"").toLowerCase().includes(q) ||
    (r.order||"").toLowerCase().includes(q) ||
    (r.sender||"").toLowerCase().includes(q) ||
    (r.product||"").toLowerCase().includes(q) ||
    String(r.quantity||"").includes(q) ||
    (r.barcode||"").includes(q)
  );
}
function sortRows(rows, sortState){
  if(!sortState || !sortState.key) return rows;
  const {key, dir} = sortState;
  const copy = rows.slice();
  copy.sort((a,b)=>{
    let av, bv;
    if(key==="date"){ av = dateOnlyKey(a.dt); bv = dateOnlyKey(b.dt); }
    else if(key==="user"){ av=a.user; bv=b.user; }
    else if(key==="sender"){ av=a.sender; bv=b.sender; }
    else if(key==="article"){ av=a.article; bv=b.article; }
    else if(key==="barcode"){ av=a.barcode; bv=b.barcode; }
    if(av < bv) return -1*dir;
    if(av > bv) return 1*dir;
    return 0;
  });
  return copy;
}
function sortArrow(sortState, key){
  if(!sortState || sortState.key!==key) return "";
  return sortState.dir===1 ? '<span class="arrow">▲</span>' : '<span class="arrow">▼</span>';
}
function receiptTypeLabel(row){
  return row.receiptType || row.receivingType || row.type || "—";
}
function receiptUserName(row){
  const uid = String(row.userId || "").trim();
  const email = String(row.userEmail || "").trim().toLowerCase();
  const profile = (DB.users||[]).find(user =>
    (uid && String(user.id||user.uid||"").trim()===uid) ||
    (email && String(user.email||"").trim().toLowerCase()===email) ||
    (row.user && String(user.login||"").trim()===String(row.user).trim())
  );
  const profileName = profile
    ? [profile.firstName, profile.lastName].filter(value=>String(value||"").trim()).join(" ").trim()
    : "";
  const rawUser = String(row.user||"").trim();
  const fallbackName = rawUser && !rawUser.includes("@") && rawUser!==uid ? rawUser : "";
  return profileName || fallbackName || "—";
}
function receiptTypeHtml(row){
  const label = receiptTypeLabel(row);
  const cls = label==="Авто" ? "ok" : label==="По заданию" ? "warn" : "brand";
  return `<span class="badge ${cls} receipt-kind">${adminEsc(label)}</span>`;
}
function receiptTableColumns(historyMode){
  return historyMode
    ? ["date","user","sender","product","quantity","barcode","article","order","expiry","actions"]
    : ["date","type","user","barcode","article","order","sender","product","quantity","expiry","actions"];
}
function receiptHeaderHtml(key, sortState, allowSort){
  const labels = {
    date:"Дата и время", type:"Вид приёмки", user:"Принявший", barcode:"Штрих-код",
    article:"Артикул", order:"№ заказа", sender:"Отправитель", product:"Товар",
    quantity:"Количество", expiry:"Срок годности", actions:"Действия"
  };
  if(key==="actions" || key==="type" || key==="order" || key==="product" ||
     key==="quantity" || key==="expiry"){
    return `<th>${labels[key]}</th>`;
  }
  return allowSort
    ? `<th class="sortable" data-col="${key}">${labels[key]}${sortArrow(sortState,key)}</th>`
    : `<th>${labels[key]}</th>`;
}
function receiptCellHtml(row, key){
  if(key==="date") return `<td class="num">${fmtDT(row.dt)}</td>`;
  if(key==="type") return `<td>${receiptTypeHtml(row)}</td>`;
  if(key==="user") return `<td>${adminEsc(receiptUserName(row))}</td>`;
  if(key==="barcode") return `<td class="mono">${adminEsc(row.barcode)}</td>`;
  if(key==="article") return `<td class="mono">${adminEsc(row.article)}</td>`;
  if(key==="order") return `<td class="mono">${adminEsc(row.order)}</td>`;
  if(key==="sender") return `<td>${adminEsc(row.sender)}</td>`;
  if(key==="product") return `<td>${adminEsc(row.product)}</td>`;
  if(key==="quantity") return `<td class="num">${adminEsc(row.quantity || 0)}</td>`;
  if(key==="expiry") return `<td class="num">${expiryBadge(row.expiry)}</td>`;
  if(key==="actions") return `<td style="white-space:nowrap;">
    <button class="icon-btn" data-act="edit" data-id="${adminEsc(row.id)}" title="Изменить">✎</button>
    <button class="icon-btn" data-act="del" data-id="${adminEsc(row.id)}" title="Удалить">🗑</button>
  </td>`;

}

function printRowDateKey(row, printKey){

}
function printDateList(rows, printKey){

    .sort((a,b)=>b.localeCompare(a));
}
function printDateLabel(dateKey){

function printDateMatches(value, cfg){
  const date = value instanceof Date ? value : new Date(value);
  if(isNaN(date)) return false;
  const key = dateOnlyKey(date);
  if(cfg.from){
    const from = new Date(cfg.from + "T00:00:00");
    if(key < dateOnlyKey(from)) return false;
  }
  if(cfg.to){
    const to = new Date(cfg.to + "T00:00:00");
    if(key > dateOnlyKey(to)) return false;
  }
  return true;
}
function printValue(row, key, kind){
  if(kind==="inventory"){
    if(key==="date") return row.date instanceof Date ? fmtD(row.date) : fmtD(new Date(row.date));
    if(key==="window") return row.window || "—";
    if(key==="user") return row.user || "—";
    if(key==="address") return row.address || "—";
    if(key==="product") return row.product || "—";
    if(key==="barcode") return row.barcode || "—";
    if(key==="quantity") return row.quantity ?? 0;
    if(key==="expiry") return row.expiry || "—";
  }
  if(key==="date") return fmtDT(row.dt);
  if(key==="type") return receiptTypeLabel(row);
  if(key==="user") return receiptUserName(row);
  if(key==="barcode") return row.barcode || "—";
  if(key==="article") return row.article || "—";
  if(key==="order") return row.order || "—";
  if(key==="sender") return row.sender || "—";
  if(key==="product") return row.product || "—";
  if(key==="quantity") return row.quantity ?? 0;
  if(key==="expiry") return row.expiry instanceof Date && !isNaN(row.expiry) ? fmtD(row.expiry) : "—";
  return "—";
}
function printRows(printKey, sourceRows){
  const cfg = state.print[printKey];
  const kind = printKey==="inventory" ? "inventory" : "receipt";
  const columnSource = printKey==="history" ? PRINT_COLUMNS.history : PRINT_COLUMNS[kind];
  const columns = columnSource.filter(col=>cfg.cols.includes(col.key));
  if(!columns.length){ toast("Выберите хотя бы одну колонку для печати"); return; }
  const rows = (sourceRows||[]).filter(row=>{
    const dateValue = kind==="inventory" ? row.date : row.dt;
    return printDateMatches(dateValue, cfg);
  });
  const title = printKey==="inventory" ? "Инвентаризация" :
    printKey==="history" ? "История приёмки" : "Приёмка товаров";
  const range = cfg.from || cfg.to ? `Период: ${cfg.from || "—"} — ${cfg.to || "—"}` : "Период: все даты";
  const report = document.createElement("div");
  report.className = "print-report";
  report.innerHTML = `
    <h1>${title}</h1>
    <div class="print-meta">${range} · Строк: ${rows.length} · Напечатано: ${fmtDT(new Date())}</div>
    <table>
      <thead><tr>${columns.map(col=>`<th>${adminEsc(col.label)}</th>`).join("")}</tr></thead>
      <tbody>${rows.length ? rows.map(row=>`<tr>${columns.map(col=>`<td>${adminEsc(printValue(row,col.key,kind))}</td>`).join("")}</tr>`).join("") :
        `<tr><td colspan="${columns.length}">За выбранный период записей нет</td></tr>`}</tbody>
    </table>
  `;
  document.body.appendChild(report);
  const cleanup = ()=>{
    if(report.parentNode) report.remove();
    document.body.classList.remove("is-printing");
  };
  window.addEventListener("afterprint", cleanup, {once:true});
  document.body.classList.add("is-printing");
  window.print();
  setTimeout(cleanup, 5000);
}
function tableRowsHtml(rows, colName, historyMode){
  if(rows.length===0){
    return `<tr class="empty-row"><td colspan="${receiptTableColumns(historyMode).length}">Ничего не найдено</td></tr>`;
  }
  const columns = receiptTableColumns(historyMode);
  let previousDate = "";
  return rows.map(r=>{
    const date = r.dt instanceof Date ? r.dt : new Date(r.dt);
    const dateKey = isNaN(date) ? "" : toDateInputValue(date);
    const divider = dateKey && dateKey !== previousDate
      ? `<tr class="date-divider"><td colspan="${columns.length}">Дата приёма: ${adminEsc(fmtD(date))}</td></tr>`
      : "";
    previousDate = dateKey;
    return `${divider}<tr>${columns.map(key=>receiptCellHtml(r,key)).join("")}</tr>`;
  }).join("");
}

function renderReceivingTable(containerId, rows, opts){
  const {searchKey, sortKey, allowSort, colName, historyMode=false, printKey="receiving", combined=false} = opts;
  const q = state.search[searchKey] || "";
  let view = filterRows(rows, q);
  if(allowSort) view = sortRows(view, state.sort[sortKey]);
  const columns = receiptTableColumns(historyMode);
  const printColumns = printKey==="history" ? PRINT_COLUMNS.history : PRINT_COLUMNS.receipt;
  const html = `
    ${printControlsHtml(printKey, printColumns, `Печать ${historyMode ? "истории" : "приёмки"}`)}

      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Поиск по этой таблице…" value="${q}" data-search="${searchKey}">
      </div>
      <div class="count-pill">${view.length} из ${rows.length}</div>
      ${allowSort ? `<div class="sort-hint">Сортировка: дата, принявший, отправитель, артикул и штрих-код — клик по заголовку</div>`:""}

    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>${columns.map(key=>receiptHeaderHtml(key,state.sort[sortKey],allowSort)).join("")}</tr></thead>
        <tbody>${tableRowsHtml(view, colName, historyMode)}</tbody>
      </table>
    </div>
  `;
  document.getElementById(containerId).innerHTML = html;

  const root = document.getElementById(containerId);
  const input = root.querySelector("input[data-search]");
  input.addEventListener("input", (e)=>{
    state.search[searchKey] = e.target.value;
    renderReceivingTable(containerId, rows, opts);
    const i2 = document.querySelector(`#${containerId} input[data-search]`);
    if(i2){ i2.focus(); i2.setSelectionRange(i2.value.length, i2.value.length); }
  });
  if(allowSort){
    root.querySelectorAll("th.sortable").forEach(th=>{
      th.addEventListener("click", ()=>{
        const col = th.dataset.col;
        const s = state.sort[sortKey];
        if(s.key===col) s.dir *= -1; else { s.key=col; s.dir=1; }
        renderReceivingTable(containerId, rows, opts);
      });
    });
  }
  document.getElementById("addRecBtn").addEventListener("click", ()=>{
    const fields = combined
      ? RECEIPT_FIELDS.concat([{name:"receiptType", label:"Вид приёмки", type:"select", options:RECEIPT_TYPE_OPTIONS}])
      : RECEIPT_FIELDS;
    openModal({
      title:"Новая запись", fields,
      initial:{dt:toDatetimeLocalValue(new Date()), quantity:0, expiry:toDateInputValue(new Date()), receiptType:"Слепая"},
      onSubmit: async(values)=>{
        const target = combined
          ? ({"Слепая":COL.blind, "Авто":COL.auto, "По заданию":COL.task}[values.receiptType] || COL.blind)
          : colName;
        await addDoc(collection(db, target), buildReceiptPayload(values));
        toast("Запись добавлена");
      }
    });
  });
  bindPrintControls(printKey, rows);
  root.querySelectorAll(".icon-btn").forEach(b=>{
    b.addEventListener("click", ()=>{
      const id=b.dataset.id, act=b.dataset.act;
      const row = rows.find(r=>r.id===id);
      if(!row) return;
      const rowCollection = combined ? (row.sourceCollection || COL.blind) : colName;
      if(act==="edit"){
        const initVals = {...row, dt: toDatetimeLocalValue(row.dt), expiry: toDateInputValue(row.expiry)};
        openModal({
          title:"Изменить запись", fields:combined
            ? RECEIPT_FIELDS.concat([{name:"receiptType", label:"Вид приёмки", type:"select", options:RECEIPT_TYPE_OPTIONS}])
            : RECEIPT_FIELDS, initial:initVals,
          onSubmit: async(values)=>{
            await updateDoc(doc(db, rowCollection, id), buildReceiptPayload(values));
            toast("Изменения сохранены");
          }
        });
      } else if(act==="del"){
        if(confirm("Удалить запись безвозвратно?")){
          deleteDoc(doc(db, rowCollection, id)).then(()=>toast("Запись удалена"))
            .catch(err=>toast("Ошибка удаления: "+err.message));
        }
      }
    });
  });

function newProductTargetId(values){
  const key = String(values.barcode || values.name || values.article || "").trim();
  return "product_" + encodeURIComponent(key.toLocaleLowerCase("ru-RU"))
    .replace(/%/g, "_").slice(0, 420);
}

/* =========================================================
   ОКНА СКЛАДА
   Один документ warehouse_windows = один браузер/рабочее окно склада.
   Внутри снимка есть пользователь, адреса хранения и локальные приёмки.
   ========================================================= */
function adminEsc(value){
  return String(value ?? "").replace(/[&<>"']/g, ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}
function cloudDate(value){
  const n = Number(value||0);
  if(!n) return "—";
  const d = new Date(n);
  return isNaN(d) ? "—" : fmtDT(d);
}
function windowOperator(row){
  return row.userName || row.operator?.userName || row.userEmail ||
    row.operator?.email || row.userId || "Пользователь не определён";
}
function windowAddress(location){
  if(!location) return "Приёмка";
  return [location.warehouse, location.row, location.floor, location.shelf]
    .filter(value=>value !== undefined && value !== null && String(value).trim() && String(value) !== "--")
    .map(value=>String(value).trim()).join(" · ") || "Адрес не указан";
}
function warehouseWindowRows(){
  const rows = [];
  (DB.windows||[]).forEach(windowRow=>{
    const base = {
      windowId: windowRow.windowId || windowRow.id,
      windowName: windowRow.windowName || ("Окно " + String(windowRow.id||"").slice(-6)),
      operator: windowOperator(windowRow),
      updatedAt: Number(windowRow.updatedAt||0)
    };
    const locations = windowRow.inventoryLocations &&
      typeof windowRow.inventoryLocations === "object"
      ? windowRow.inventoryLocations : {};
    Object.values(locations).forEach(location=>{
      Object.values(location?.items || {}).forEach(item=>{
        const qty = Number(item?.quantity||0);
        if(qty <= 0) return;
        rows.push({
          ...base, kind:"Остаток", address:windowAddress(location),
          product:item.name || "Без названия", barcode:item.barcode || "—",
          quantity:qty, expiry:item.expiry || "—",
          updatedAt:Math.max(base.updatedAt, Number(item.lastSeen||0))
        });
      });
    });
    // Приёмки остаются видимыми даже до первого сканирования адреса.
    (Array.isArray(windowRow.arrivals) ? windowRow.arrivals : []).forEach(arrival=>{
      rows.push({
        ...base, kind:"Приёмка", address:"Новая приёмка",
        product:arrival.name || "Без названия",
        barcode:arrival.ean || "—",
        quantity:Number(arrival.menge||0),
        expiry:"—",
        updatedAt:Math.max(base.updatedAt, Number(arrival.receivedAt||0) || 0),
        arrivalDate:arrival.date || ""
      });
    });
  });
  return rows.sort((a,b)=>b.updatedAt-a.updatedAt);
}

        </tr></thead>
        <tbody>${rows.length ? rows.map(row=>`
          <tr>
            <td class="mono">${adminEsc(row.windowName)}</td>

            <td class="mono">${adminEsc(row.barcode)}</td>

/* =========================================================
   ИМПОРТ / ЭКСПОРТ
   ========================================================= */
function normalizeImportedRecord(raw, idx){
  const pick = (...names)=>{
    for(const n of names){ if(raw[n]!==undefined && raw[n]!==null && raw[n]!=="") return raw[n]; }
    return "";
  };
  let dt = pick("dt","Дата","Дата и время","datetime");
  dt = dt ? new Date(dt) : new Date();
  if(isNaN(dt)) dt = new Date();
  let exp = pick("expiry","Срок годности","expiration");
  exp = exp ? new Date(exp) : new Date();
  if(isNaN(exp)) exp = new Date();
  return {
    dt, expiry: exp,
    user: pick("user","Пользователь","Принявший") || "",
    article: String(pick("article","Артикул") || ""),
    order: String(pick("order","№ заказа","Номер заказа") || ""),
    sender: pick("sender","Отправитель") || "",
    product: pick("product","Товар","Наименование") || "",
    quantity: Number(pick("quantity","Количество","Кол-во","qty") || 0),
    barcode: String(pick("barcode","Штрих-код","Штрихкод") || ""),
  };
}

function handleExcelFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, {type:"array"});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, {defval:""});
      state.importedRows = json.map((r,i)=>normalizeImportedRecord(r, i));
      state.importFileName = file.name;
      state.importKind = "excel";
      toast(`Считано строк: ${json.length}`);
      renderImport();
    }catch(err){ toast("Не удалось прочитать Excel-файл: "+err.message); }
  };
  reader.readAsArrayBuffer(file);
}
function handleJsonFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      const arr = Array.isArray(parsed) ? parsed : (parsed.rows || parsed.data || []);
      state.importedRows = arr.map((r,i)=>normalizeImportedRecord(r, i));
      state.importFileName = file.name;
      state.importKind = "json";
      toast(`Считано строк: ${arr.length}`);
      renderImport();
    }catch(err){ toast("Файл повреждён или имеет неверный формат JSON"); }
  };
  reader.readAsText(file);
}
async function commitImport(){
  const colMap = {blind:COL.blind, auto:COL.auto, task:COL.task};
  const colName = colMap[state.importTarget];
  if(!colName || state.importedRows.length===0) return;
  const btn = document.getElementById("commitImport");
  btn.disabled = true; btn.textContent = "Загрузка…";
  try{
    for(const r of state.importedRows){
      await addDoc(collection(db, colName), {
        dt: r.dt.toISOString(), user:r.user, article:r.article, order:r.order,
        sender:r.sender, product:r.product, quantity:r.quantity,
        expiry:r.expiry.toISOString(), barcode:r.barcode,
      });
    }
    const n = state.importedRows.length;
    state.importedRows = []; state.importFileName = ""; state.importKind = "";
    toast(`Загружено записей: ${n}`);
  }catch(err){
    toast("Ошибка загрузки: "+err.message);
  }
  renderImport();
}

function rowsToPlain(rows){
  return rows.map(r=>({
    "Дата и время": fmtDT(r.dt), "Вид приёмки": receiptTypeLabel(r),
    "Пользователь": receiptUserName(r), "Штрих-код": r.barcode, "Артикул": r.article,
    "№ заказа": r.order, "Отправитель": r.sender, "Товар": r.product,
    "Количество": r.quantity || 0, "Срок годности": fmtD(r.expiry),
  }));
}
function runExport(){
  const sel = state.exportSel;
  const sheets = {};
  if(sel.blind) sheets["Слепая приёмка"] = rowsToPlain(DB.blind);
  if(sel.auto) sheets["Автоприём"] = rowsToPlain(DB.autoRecv);
  if(sel.taskRecv) sheets["Приём по задаче"] = rowsToPlain(DB.taskRecv);
  if(sel.catalog) sheets["Каталог"] = DB.catalog.map(c=>({
    "Артикул":c.article,"Наименование":c.name,"Категория":c.category,"Ед. изм.":c.unit,"Штрих-код":c.barcode
  }));
  if(sel.history){
    let rows = DB.history.slice();
    const {from,to} = state.exportHistoryRange;
    if(from){ const f=new Date(from); rows = rows.filter(r=>r.dt>=f); }
    if(to){ const t=new Date(to); t.setHours(23,59,59,999); rows = rows.filter(r=>r.dt<=t); }
    sheets["История"] = rowsToPlain(rows);
  }
  if(sel.inventory){
    const chosen = DB.inventory.filter(s=>state.exportInventorySessions.has(s.session));
    sheets["Инвентаризация"] = chosen.map(s=>({
      "№ сессии": s.session, "Дата": fmtD(s.date), "Ответственный": s.user, "Позиций": s.items, "Статус": s.status
    }));
  }
  if(Object.keys(sheets).length===0){ toast("Выберите хотя бы одну базу для экспорта"); return; }

  const stamp = fmtD(new Date()).split(".").join("-");
  if(state.exportFormat === "excel"){
    const wb = XLSX.utils.book_new();
    Object.entries(sheets).forEach(([name, data])=>{
      const ws = XLSX.utils.json_to_sheet(data);
      XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
    });
    XLSX.writeFile(wb, `export-${stamp}.xlsx`);
  } else {
    const blob = new Blob([JSON.stringify(sheets, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `export-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  toast("Файл экспортирован на устройство");
}

    warehouseWindowRows().filter(row=>row.kind==="Остаток").map(row=>({
      ...row,

      user: row.operator,

    ${printControlsHtml("inventory", PRINT_COLUMNS.inventory, "Печать инвентаризации")}

      <div class="count-pill">${onlineRows.length} строк товаров онлайн</div>

        <tbody>${onlineRows.length ? onlineRows.map(row=>`
          <tr>
            <td class="num">${cloudDate(row.updatedAt)}</td>
            <td class="mono">${adminEsc(row.window)}</td>
            <td>${adminEsc(row.user)}</td>
            <td>${adminEsc(row.address)}</td>
            <td>${adminEsc(row.product)}</td>
            <td class="mono">${adminEsc(row.barcode)}</td>
            <td class="num">${adminEsc(row.quantity)}</td>
            <td>${adminEsc(row.expiry)}</td>
          </tr>
        `).join("") : `<tr class="empty-row"><td colspan="8">Онлайн-инвентаризация пока пуста</td></tr>`}</tbody>
      </table>
    </div>
    <div class="card" style="margin-top:14px;">
      <h3>Новая инвентаризация</h3>
      <div class="desc">Список выше поступает из рабочих окон склада и хранится в Firebase. Локальная кнопка ниже оставлена для совместимости со старыми сессиями.</div>
      <button class="btn" id="newInv">Начать инвентаризацию</button>

    DB.inventory.push({session:n, date:new Date(), user: who || "—", items:0, status:"открыта"});
    state.exportInventorySessions.add(n);
    toast(`Инвентаризация №${n} открыта`);
    renderInventory();
  });
}

/* =========================================================
   ЗАДАЧА ПОЛЬЗОВАТЕЛЮ (пишет в tasks_<ID из карточки пользователя>)
   ========================================================= */
function renderUserTasks(){
  if(!selectedTaskUser && DB.users && DB.users.length) selectedTaskUser = DB.users[0].id;
  const html = `
    <div class="card">
      <h3>Новая задача</h3>
      <div class="grid-2">
        <div class="field">
          <label>Сотрудник</label>
          <select id="taskUserSel">
            ${(DB.users||[]).map(u=>`<option value="${u.id}" ${u.id===selectedTaskUser?'selected':''}>${u.firstName||''} ${u.lastName||''} (${u.login||u.id})</option>`).join("") || `<option value="">Нет пользователей</option>`}
          </select>
        </div>
        <div class="field"><label>Срок выполнения</label><input type="date" id="taskDue"></div>
      </div>
      <div class="field"><label>Описание задачи</label>
        <textarea id="taskText" placeholder="Например: пересчитать остатки по стеллажу B-04"></textarea>
      </div>
      <button class="btn" id="addTask" ${selectedTaskUser? "":"disabled"}>Поставить задачу</button>
    </div>
    <div class="card">
      <h3>Задачи выбранного сотрудника <span style="font-weight:400; color:var(--ink-soft); font-size:12.5px;">— tasks_${selectedTaskUser||''}</span></h3>
      <div class="placeholder-list" id="taskList">Загрузка…</div>
    </div>
  `;
  document.getElementById("content").innerHTML = html;

  const sel = document.getElementById("taskUserSel");
  if(sel){
    sel.addEventListener("change", e=>{
      selectedTaskUser = e.target.value || null;
      renderUserTasks();
    });
  }
  const addBtn = document.getElementById("addTask");
  if(addBtn){
    addBtn.addEventListener("click", async ()=>{
      if(!selectedTaskUser){ toast("Выберите сотрудника"); return; }
      const due = document.getElementById("taskDue").value;
      const text = document.getElementById("taskText").value.trim();
      if(!text){ toast("Опишите задачу перед постановкой"); return; }
      try{
        await addDoc(collection(db, "tasks_"+selectedTaskUser), {
          text,
          dueDate: due ? new Date(due).toISOString() : new Date().toISOString(),
          done:false,
          createdAt: serverTimestamp(),
          assignedBy: window.currentProfile ? window.currentProfile.id : null,
        });
        toast("Задача поставлена");
        document.getElementById("taskText").value = "";
      }catch(err){ toast("Ошибка постановки задачи: "+err.message); }
    });
  }
  subscribeTasks(selectedTaskUser);
}
function subscribeTasks(userId){
  if(taskUnsub){ taskUnsub(); taskUnsub=null; }
  tasksCache = [];
  if(!userId){ renderTaskListArea(); return; }
  taskUnsub = onSnapshot(collection(db, "tasks_"+userId), snap=>{
    tasksCache = snap.docs.map(d=>({id:d.id, ...d.data()}));
    tasksCache.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    renderTaskListArea();
  }, err=>{
    const el = document.getElementById("taskList");
    if(el) el.innerHTML = `<div class="desc">Не удалось загрузить задачи: ${err.message}</div>`;
  });
}
function renderTaskListArea(){
  const list = document.getElementById("taskList");
  if(!list) return;
  if(tasksCache.length===0){ list.innerHTML = `<div class="desc">Задач пока нет.</div>`; return; }
  list.innerHTML = tasksCache.map(t=>`
    <div class="task-item">
      <div style="flex:1;">
        <div class="txt">${t.text||''}</div>
        <div class="meta">Срок: ${t.dueDate? fmtD(new Date(t.dueDate)) : '—'}</div>
      </div>
      <div class="actions">
        <button class="status-toggle" data-id="${t.id}" style="background:${t.done?'#e7f3ec':'var(--warn-soft)'}; color:${t.done?'var(--ok)':'var(--warn)'}">
          ${t.done? "выполнено" : "в работе"}
        </button>
      </div>
    </div>
  `).join("");
  list.querySelectorAll("button[data-id]").forEach(b=>{
    b.addEventListener("click", async ()=>{
      const t = tasksCache.find(x=>x.id===b.dataset.id);
      if(!t || !selectedTaskUser) return;
      try{ await updateDoc(doc(db, "tasks_"+selectedTaskUser, t.id), {done: !t.done}); }
      catch(err){ toast("Ошибка обновления: "+err.message); }
    });
  });
}

function allReceivingRows(){
  return [
    ...(DB.blind||[]).map(row=>({...row, sourceCollection:COL.blind, receiptType:row.receiptType||"Слепая"})),
    ...(DB.autoRecv||[]).map(row=>({...row, sourceCollection:COL.auto, receiptType:row.receiptType||"Авто"})),
    ...(DB.taskRecv||[]).map(row=>({...row, sourceCollection:COL.task, receiptType:row.receiptType||"По заданию"})),
  ].sort((a,b)=>b.dt.getTime()-a.dt.getTime());
}

function adminSearchDateKey(row){
  const date = row?.dt instanceof Date ? row.dt : new Date(row?.dt);
  return isNaN(date) ? "" : toDateInputValue(date);
}
function adminSearchDateLabel(row){
  const date = row?.dt instanceof Date ? row.dt : new Date(row?.dt);
  return isNaN(date) ? "Дата не указана" : fmtD(date);
}
function adminSearchRowText(row){
  return [
    adminSearchDateLabel(row),
    row.product, row.barcode, row.article, row.order, row.sender,
    receiptUserName(row), row.receiptType
  ].map(value=>String(value || "").toLowerCase()).join(" ");
}
function adminSearchMatches(row){
  const filter = adminSearchState.filter;
  if(filter){
    const value = String(filter.value || "").trim().toLowerCase();
    if(filter.kind==="date") return adminSearchDateKey(row)===filter.key;
    if(filter.kind==="order") return String(row.order || "").trim().toLowerCase()===value;
    if(filter.kind==="sender") return String(row.sender || "").trim().toLowerCase()===value;
  }
  const query = String(adminSearchState.query || "").trim().toLowerCase();
  if(query.length < 3) return false;
  return adminSearchRowText(row).includes(query);
}
function adminSearchFilteredRows(){
  return allReceivingRows().filter(adminSearchMatches)
    .sort((a,b)=>b.dt.getTime()-a.dt.getTime());
}
function adminSearchFilterButton(label, kind, value, key){
  if(!String(value || "").trim()) return "";
  return `<button type="button" class="admin-card-link" data-admin-card-filter="${kind}"
    data-admin-card-filter-value="${adminEsc(value)}" data-admin-card-filter-key="${adminEsc(key || "")}">
    ${adminEsc(value)}</button>`;
}
function closeAdminSearchCard(){
  adminSearchState.activeRow = null;
  const card = document.getElementById("adminFloatingCard");
  if(card) {
    card.classList.remove("open");
    card.innerHTML = "";
  }
}
function openAdminSearchCard(row){
  adminSearchState.activeRow = row;
  const card = document.getElementById("adminFloatingCard");
  if(!card) return;
  const dateKey = adminSearchDateKey(row);
  card.innerHTML = `
    <div class="admin-floating-card-head">
      <div class="admin-floating-card-title">${adminEsc(row.product || "Товар")}</div>
      <button type="button" class="admin-floating-card-close" aria-label="Закрыть">✕</button>
    </div>
    <div class="admin-card-grid">
      <div class="admin-card-field"><span class="admin-card-label">Дата приёма</span>
        <button class="admin-card-link" data-admin-card-filter="date" data-admin-card-filter-value="${adminEsc(adminSearchDateLabel(row))}" data-admin-card-filter-key="${dateKey}">${adminEsc(adminSearchDateLabel(row))}</button></div>
      <div class="admin-card-field"><span class="admin-card-label">Количество</span><span class="admin-card-value">${adminEsc(row.quantity ?? 0)}</span></div>
      <div class="admin-card-field"><span class="admin-card-label">EAN</span><span class="admin-card-value">${adminEsc(row.barcode || "—")}</span></div>
      <div class="admin-card-field"><span class="admin-card-label">Артикул</span><span class="admin-card-value">${adminEsc(row.article || "—")}</span></div>
      <div class="admin-card-field"><span class="admin-card-label">Номер заказа</span>
        ${adminSearchFilterButton("Заказ", "order", row.order, "") || '<span class="admin-card-value">—</span>'}</div>
      <div class="admin-card-field"><span class="admin-card-label">Отправитель</span>
        ${adminSearchFilterButton("Отправитель", "sender", row.sender, "") || '<span class="admin-card-value">—</span>'}</div>
      <div class="admin-card-field"><span class="admin-card-label">Принял</span><span class="admin-card-value">${adminEsc(receiptUserName(row))}</span></div>
      <div class="admin-card-field"><span class="admin-card-label">Вид приёмки</span><span class="admin-card-value">${adminEsc(receiptTypeLabel(row))}</span></div>
    </div>
  `;
  card.classList.add("open");
  card.querySelector(".admin-floating-card-close").addEventListener("click", closeAdminSearchCard);
  card.querySelectorAll("[data-admin-card-filter]").forEach(button=>{
    button.addEventListener("click", ()=>{
      const kind = button.dataset.adminCardFilter;
      const value = button.dataset.adminCardFilterValue || "";
      adminSearchState.filter = {
        kind,
        value,
        key: button.dataset.adminCardFilterKey || ""
      };
      adminSearchState.query = "";
      closeAdminSearchCard();
      renderDashboardResults();
    });
  });
}
function clearAdminSearch(){
  adminSearchState.query = "";
  adminSearchState.filter = null;
  closeAdminSearchCard();
  const input = document.getElementById("adminMainSearchInput");
  if(input) input.value = "";
  renderDashboardResults();
  input?.focus();
}
function renderDashboardResults(){
  const root = document.getElementById("adminDashboardResults");
  const home = document.getElementById("adminDashboard");
  if(!root || !home) return;
  const queryActive = String(adminSearchState.query || "").trim().length >= 3 || adminSearchState.filter;
  home.classList.toggle("searching", Boolean(queryActive));
  const clear = document.getElementById("adminMainSearchClear");
  if(clear) clear.classList.toggle("visible", Boolean(adminSearchState.query || adminSearchState.filter));
  if(!queryActive){
    root.innerHTML = "";
    return;
  }
  const rows = adminSearchFilteredRows();
  adminSearchState.rows = rows;
  const filterLabel = adminSearchState.filter
    ? `${adminSearchState.filter.kind==="date" ? "Дата" : adminSearchState.filter.kind==="order" ? "Заказ" : "Отправитель"}: ${adminSearchState.filter.value || adminSearchDateLabel(rows[0] || {})}`
    : `Поиск: ${adminSearchState.query}`;
  let previousDate = "";
  const body = rows.map((row,index)=>{
    const dateKey = adminSearchDateKey(row);
    const divider = dateKey !== previousDate
      ? `<tr class="date-divider"><td colspan="4">${adminEsc(adminSearchDateLabel(row))}</td></tr>`
      : "";
    previousDate = dateKey;
    const meta = [
      row.order ? `Заказ: ${row.order}` : "",
      row.sender ? `Отправитель: ${row.sender}` : "",
      receiptTypeLabel(row)
    ].filter(Boolean).join(" · ");
    return `${divider}<tr data-admin-search-index="${index}">
      <td class="num">${adminEsc(adminSearchDateLabel(row))}</td>
      <td>${adminEsc(row.product || "—")}<span class="result-meta">${adminEsc(meta)}</span></td>
      <td class="mono">${adminEsc(row.barcode || "—")}</td>
      <td class="num">${adminEsc(row.quantity ?? 0)}</td>
    </tr>`;
  }).join("");
  root.innerHTML = `
    <div class="admin-search-status">
      <span>${rows.length} ${rows.length===1 ? "результат" : "результатов"}</span>
      <button type="button" class="admin-search-filter" id="adminSearchFilterChip">${adminEsc(filterLabel)} ×</button>
    </div>
    <div class="admin-search-results-table">
      ${rows.length ? `<table><thead><tr><th>Дата</th><th>Товар</th><th>EAN</th><th>Кол-во</th></tr></thead><tbody>${body}</tbody></table>`
        : `<div class="admin-search-empty">Ничего не найдено. Проверьте товар, дату, заказ или отправителя.</div>`}
    </div>
  `;
  document.getElementById("adminSearchFilterChip")?.addEventListener("click", clearAdminSearch);
  root.querySelectorAll("[data-admin-search-index]").forEach(rowEl=>{
    rowEl.addEventListener("click", ()=>{
      const row = rows[Number(rowEl.dataset.adminSearchIndex)];
      if(row) openAdminSearchCard(row);
    });
  });
}
function renderDashboard(){
  const root = document.getElementById("content");
  root.innerHTML = `
    <div class="admin-home" id="adminDashboard">
      <div class="admin-home-search-wrap">
        <div class="admin-home-brand">WAREHOUSE<small>АДМИН · ПОИСК ПРИЁМОК</small></div>
        <div class="admin-main-search">
          <input id="adminMainSearchInput" type="search" autocomplete="off" spellcheck="false"
            placeholder="Поиск товара, EAN, даты, заказа или отправителя">
          <button type="button" class="admin-search-clear" id="adminMainSearchClear" aria-label="Очистить">✕</button>
        </div>
      </div>
      <div class="admin-home-results" id="adminDashboardResults"></div>
    </div>
  `;
  const input = document.getElementById("adminMainSearchInput");
  input.value = adminSearchState.query;
  input.addEventListener("input", event=>{
    adminSearchState.query = event.target.value;
    adminSearchState.filter = null;
    renderDashboardResults();

  document.getElementById("adminMainSearchClear").addEventListener("click", clearAdminSearch);
  renderDashboardResults();
}

async function initApp(userId){
  // UID из Firebase Auth уже подтверждает вход. Не блокируем интерфейс
  // ожиданием чтения дополнительного документа профиля.
  localStorage.setItem("wh_user_id", userId);
  window.currentProfile = {
    id: userId,
    email: auth.currentUser?.email || "",
    role: "admin"
  };

  renderSidebar();
  renderTop();
  renderContent();
  subscribeAll();

  // Профиль загружаем после отображения панели. Даже если чтение документа
  // будет запрещено правилами Firestore, меню и основные функции останутся видимыми.
  try{
    const snap = await getDoc(doc(db, COL.users, userId));
    if(snap.exists){
      window.currentProfile = { id: snap.id, ...snap.data() };
      renderTop();
    }
  }catch(err){
    toast("Профиль не загружен: " + err.message);
  }
}

    <div class="card" style="max-width:520px;">
      <h3>Нет доступа к панели</h3>
      <div class="desc">${message}</div>
      <a class="btn" href="index.html">Перейти ко входу</a>
    </div>
  `;
}

auth.onAuthStateChanged(user => {
  if(!user){
    renderLoginRequired();
    return;
  }

  const isAdmin =
    localStorage.getItem("wh_is_admin") === "true" ||
    user.email?.toLowerCase() === "khazratbek1@gmail.com";

  if(!isAdmin){
    renderLoginRequired("Эта учётная запись не имеет прав администратора.");
    return;
  }

  initApp(user.uid);
});
}
